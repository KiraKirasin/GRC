# =============================================================================
# GRC CI/CD — build, scan, deploy immutable image to the GCP pilot VM
# =============================================================================
#
# Flow (left → right):
#   quality → opengrep ─┐
#                       ├→ image → deploy → e2e
#                       ┘
#
# Escape hatch (never-skip dependents):
#   GitHub Actions default job condition is success(). When any needed job
#   fails, dependents are transitively Skipped and their `if:` is never even
#   evaluated — unless that `if:` includes an explicit status function
#   (always / success / failure / cancelled). That explicit status check is
#   the escape hatch.
#
#   Every dependent job therefore uses:
#     if: ${{ always() && !cancelled() }}
#   so a failure upstream still runs the next job (it may then fail on its
#   own steps). !cancelled() keeps Cancel from forcing the whole chain to run.
#
# Soft steps (not the escape hatch):
#   Trivy uses step-level continue-on-error so SBOM/export still run after
#   findings. OpenGrep / E2E use job-level continue-on-error so the workflow
#   can stay green-ish while still showing red on those jobs.
#
# Deploy/e2e jobs always start; production VM / Playwright steps are gated
# by step-level checks to main push only.
#
# Triggers: PRs and pushes to main, plus manual workflow_dispatch.
# =============================================================================

name: GRC CI/CD to GCP VM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch/ref. Do not cancel an in-flight production deploy if a
# newer commit arrives — wait for the current run to finish.
concurrency:
  group: grc-production-${{ github.ref }}
  cancel-in-progress: false

# contents: checkout
# id-token: Workload Identity Federation (OIDC) for GCP auth
# security-events: upload SARIF (OpenGrep / Trivy) to GitHub Code Scanning
permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: grc-app
  # Immutable tag = commit SHA so every deploy is traceable
  IMAGE_TAG: ${{ github.sha }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-a
  GCP_VM_NAME: grc-pilot
  DEPLOY_PATH: /opt/grc
  APP_URL: http://136.112.38.75

jobs:
  # ---------------------------------------------------------------------------
  # quality — install, lint, unit test, production build
  # ---------------------------------------------------------------------------
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Locked install from package-lock.json (reproducible CI)
        run: npm ci

      - name: Generate Prisma client
        # Prisma client is required by the TypeScript build; CI uses a throwaway
        # SQLite URL (no real DB needed for `prisma generate`).
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Lint
        # --if-present: skip quietly if no lint script is defined
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

  # ---------------------------------------------------------------------------
  # opengrep — SAST (soft job). Escape hatch: always() so quality failure
  # does not Skipped this job.
  # ---------------------------------------------------------------------------
  opengrep:
    name: OpenGrep SAST
    runs-on: ubuntu-latest
    needs: quality
    # Escape hatch: re-evaluate after quality even when quality failed.
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenGrep
        # Pin a release binary for reproducible CI (manylinux x86_64 on ubuntu-latest).
        # Bump OPENGREP_VERSION deliberately when upgrading.
        env:
          OPENGREP_VERSION: v1.25.0
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          chmod +x "${HOME}/bin/opengrep"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/opengrep" --version

      - name: OpenGrep SAST scan
        # --severity ERROR: only ERROR-level rules count toward failure
        # --error: non-zero exit when matching findings exist
        # --sarif-output: for GitHub Code Scanning upload (next step)
        run: |
          opengrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --sarif-output=opengrep.sarif \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=coverage \
            --exclude-dir=.git \
            .

      - name: Upload OpenGrep results to GitHub Security
        # Step escape hatch: upload even when the scan step failed on findings
        if: ${{ always() && hashFiles('opengrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  # ---------------------------------------------------------------------------
  # image — Docker build, SBOM, Trivy (soft step), export artifact
  # Escape hatch: always() after quality + opengrep (neither may Skipped us).
  # ---------------------------------------------------------------------------
  image:
    name: Build, SBOM and container scan
    runs-on: ubuntu-latest
    needs: [quality, opengrep]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable deployment image
        # Labels embed git revision + source URL for supply-chain traceability.
        # Tag both SHA (immutable) and latest (compose convenience on the VM).
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Generate CycloneDX SBOM
        # Software Bill of Materials for the exact image we are about to scan/deploy
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error

      - name: Trivy vulnerability scan
        # Soft step: findings fail this step; continue-on-error keeps export alive
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Export exact scanned image
        # Persist the bit-identical image that Trivy scanned (gzip + checksum)
        run: |
          docker save \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:latest" |
          gzip --best > grc-app-image.tar.gz

          sha256sum grc-app-image.tar.gz > grc-app-image.tar.gz.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v5
        with:
          name: grc-app-image-${{ github.sha }}
          path: |
            grc-app-image.tar.gz
            grc-app-image.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # deploy — escape hatch always(); production steps only on main push
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy exact image to GCP VM
    runs-on: ubuntu-latest
    needs: image
    # Escape hatch: run even when image failed (steps may then no-op / fail).
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 20
    # production env only on main push so PRs are not held by deploy protection
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'ci' }}
      url: http://136.112.38.75

    steps:
      - name: Decide whether to promote to production
        id: promote
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Promoting image to production VM."
          else
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Job ran via escape hatch; production deploy steps gated to main push."
          fi

      - name: Checkout deployment configuration
        if: steps.promote.outputs.should_deploy == 'true'
        uses: actions/checkout@v5

      - name: Download scanned image
        if: steps.promote.outputs.should_deploy == 'true'
        uses: actions/download-artifact@v5
        with:
          name: grc-app-image-${{ github.sha }}
          path: deployment-artifact

      - name: Verify deployment artifact
        if: steps.promote.outputs.should_deploy == 'true'
        working-directory: deployment-artifact
        run: sha256sum --check grc-app-image.tar.gz.sha256

      - name: Authenticate to Google Cloud with OIDC
        if: steps.promote.outputs.should_deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.promote.outputs.should_deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Upload image and deployment files
        if: steps.promote.outputs.should_deploy == 'true'
        run: |
          gcloud compute scp \
            deployment-artifact/grc-app-image.tar.gz \
            docker-compose.yml \
            deploy/Caddyfile \
            "${GCP_VM_NAME}:/tmp/" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet

      - name: Deploy on VM
        if: steps.promote.outputs.should_deploy == 'true'
        # docker load CI artifact; compose up --no-build (immutable bytes from CI)
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              set -Eeuo pipefail

              sudo mkdir -p '${DEPLOY_PATH}/deploy'
              sudo cp /tmp/docker-compose.yml '${DEPLOY_PATH}/docker-compose.yml'
              sudo cp /tmp/Caddyfile '${DEPLOY_PATH}/deploy/Caddyfile'
              sudo chown -R \$(id -u):\$(id -g) '${DEPLOY_PATH}'

              gzip --decompress --stdout /tmp/grc-app-image.tar.gz | docker load

              cd '${DEPLOY_PATH}'
              docker compose config --quiet
              docker compose up -d --no-build --remove-orphans

              docker image prune -f
              docker compose ps

              rm -f /tmp/grc-app-image.tar.gz \
                    /tmp/docker-compose.yml \
                    /tmp/Caddyfile
            "

      - name: Wait for health endpoint
        if: steps.promote.outputs.should_deploy == 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "${APP_URL}/api/health"; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Health check ${attempt}/24 failed."
            sleep 5
          done

          echo "Deployment health check failed."
          exit 1

      - name: Collect deployment logs after failure
        if: ${{ failure() && steps.promote.outputs.should_deploy == 'true' }}
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              cd '${DEPLOY_PATH}' &&
              docker compose ps &&
              docker compose logs --tail=200
            " || true

  # ---------------------------------------------------------------------------
  # e2e — escape hatch always(); Playwright only on main push
  # ---------------------------------------------------------------------------
  e2e:
    name: Post-deployment E2E
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Decide whether to run E2E against production
        id: e2e_gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "Job ran via escape hatch; E2E gated to main push only."
          fi

      - name: Checkout
        if: steps.e2e_gate.outputs.should_run == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: steps.e2e_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ env.APP_URL }}

      - name: Upload E2E report
        if: ${{ always() && steps.e2e_gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
