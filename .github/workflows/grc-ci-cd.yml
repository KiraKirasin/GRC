name: GRC CI/CD to GCP VM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grc-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: grc-app
  IMAGE_TAG: ${{ github.sha }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  GCP_ZONE: us-central1-a
  GCP_VM_NAME: grc-pilot
  DEPLOY_PATH: /opt/grc
  APP_URL: http://136.112.38.75

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

  snyk:
    name: Snyk SAST, SCA and IaC
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ env.SNYK_TOKEN != '' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pin this to an approved Snyk CLI version in package.json/devDependencies
      # for fully reproducible builds.
      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Authenticate Snyk
        run: snyk auth "${SNYK_TOKEN}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source SCA gate
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code SAST gate
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC gate
        run: snyk iac test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  image:
    name: Build, SBOM and container scan
    runs-on: ubuntu-latest
    needs: [quality, snyk]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (needs.snyk.result == 'success' || needs.snyk.result == 'skipped')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable deployment image
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error

      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Snyk container gate
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npm install --global snyk
          snyk container test "${IMAGE_NAME}:${IMAGE_TAG}" \
            --file=Dockerfile \
            --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Export exact scanned image
        run: |
          docker save \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:latest" |
          gzip --best > grc-app-image.tar.gz

          sha256sum grc-app-image.tar.gz > grc-app-image.tar.gz.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v5
        with:
          name: grc-app-image-${{ github.sha }}
          path: |
            grc-app-image.tar.gz
            grc-app-image.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy exact image to GCP VM
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production
      url: http://136.112.38.75

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v5

      - name: Download scanned image
        uses: actions/download-artifact@v5
        with:
          name: grc-app-image-${{ github.sha }}
          path: deployment-artifact

      - name: Verify deployment artifact
        working-directory: deployment-artifact
        run: sha256sum --check grc-app-image.tar.gz.sha256

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Upload image and deployment files
        run: |
          gcloud compute scp \
            deployment-artifact/grc-app-image.tar.gz \
            docker-compose.yml \
            deploy/Caddyfile \
            "${GCP_VM_NAME}:/tmp/" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet

      - name: Deploy on VM
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              set -Eeuo pipefail

              sudo mkdir -p '${DEPLOY_PATH}/deploy'
              sudo cp /tmp/docker-compose.yml '${DEPLOY_PATH}/docker-compose.yml'
              sudo cp /tmp/Caddyfile '${DEPLOY_PATH}/deploy/Caddyfile'
              sudo chown -R \$(id -u):\$(id -g) '${DEPLOY_PATH}'

              gzip --decompress --stdout /tmp/grc-app-image.tar.gz | docker load

              cd '${DEPLOY_PATH}'
              docker compose config --quiet
              docker compose up -d --no-build --remove-orphans

              docker image prune -f
              docker compose ps

              rm -f /tmp/grc-app-image.tar.gz \
                    /tmp/docker-compose.yml \
                    /tmp/Caddyfile
            "

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 24); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "${APP_URL}/api/health"; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Health check ${attempt}/24 failed."
            sleep 5
          done

          echo "Deployment health check failed."
          exit 1

      - name: Collect deployment logs after failure
        if: failure()
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              cd '${DEPLOY_PATH}' &&
              docker compose ps &&
              docker compose logs --tail=200
            " || true

  e2e:
    name: Post-deployment E2E
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ env.APP_URL }}

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
