# =============================================================================
# GRC CI/CD — build, scan, deploy immutable image to the GCP pilot VM
# =============================================================================
#
# Flow (left → right):
#   quality → e2e-ci ─┐
#   quality → opengrep ─┤
#                       ├→ image → deploy → e2e-prod
#                       ┘
#
# Escape hatch (never-skip dependents):
#   GitHub Actions default job condition is success(). When any needed job
#   fails, dependents are transitively Skipped and their `if:` is never even
#   evaluated — unless that `if:` includes an explicit status function
#   (always / success / failure / cancelled). That explicit status check is
#   the escape hatch.
#
#   Every dependent job therefore uses:
#     if: ${{ always() && !cancelled() }}
#   so a failure upstream still runs the next job (it may then fail on its
#   own steps). !cancelled() keeps Cancel from forcing the whole chain to run.
#   Deploy additionally requires needs.image.result == 'success' so it never
#   tries to download a missing image artifact.
#
# Soft steps (not the escape hatch):
#   Trivy uses step-level continue-on-error so SBOM/export still run after
#   findings. OpenGrep / post-deploy E2E use job-level continue-on-error so the
#   workflow can stay green-ish while still showing red on those jobs.
#   Pre-deploy e2e-ci is a hard gate (must pass on PRs and main).
#
# Deploy/e2e-prod jobs always start when their gate allows; production VM /
# Playwright-against-APP_URL steps are gated by step-level checks to main push.
#
# Triggers: PRs and pushes to main, plus manual workflow_dispatch.
# =============================================================================

name: GRC CI/CD to GCP VM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch/ref. Do not cancel an in-flight production deploy if a
# newer commit arrives — wait for the current run to finish.
concurrency:
  group: grc-production-${{ github.ref }}
  cancel-in-progress: false

# contents: checkout
# id-token: Workload Identity Federation (OIDC) for GCP auth
# security-events: upload SARIF (OpenGrep / Trivy) to GitHub Code Scanning
permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "24"
  IMAGE_NAME: grc-app
  # Immutable tag = commit SHA so every deploy is traceable
  IMAGE_TAG: ${{ github.sha }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-a
  GCP_VM_NAME: grc-pilot
  DEPLOY_PATH: /opt/grc
  APP_URL: http://136.112.38.75

jobs:
  # ---------------------------------------------------------------------------
  # quality — install, lint, unit test, production build
  # ---------------------------------------------------------------------------
  quality:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Locked install from package-lock.json (reproducible CI)
        run: npm ci

      - name: Generate Prisma client
        # Prisma client is required by the TypeScript build; CI uses a throwaway
        # SQLite URL (no real DB needed for `prisma generate`).
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Lint
        # --if-present: skip quietly if no lint script is defined
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

  # ---------------------------------------------------------------------------
  # e2e-ci — Playwright against a local production server (PRs + main)
  # Hard gate: must pass before image build proceeds.
  # ---------------------------------------------------------------------------
  e2e-ci:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/e2e.db

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/e2e.db

      - name: Seed users for E2E login
        run: npm run seed-users
        env:
          DATABASE_URL: file:./prisma/e2e.db
          SEED_USER_PASSWORD: grc123

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start API and run E2E suite
        env:
          DATABASE_URL: file:./prisma/e2e.db
          NODE_ENV: production
          PORT: "3100"
          JWT_SECRET: ci-e2e-jwt-secret-not-for-production
          JWT_EXPIRES: 1h
          SEED_USER_PASSWORD: grc123
          E2E_BASE_URL: http://127.0.0.1:3100
          E2E_EMAIL: admin@novapay.ua
          E2E_PASSWORD: grc123
          APP_ORIGIN: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          SERVER_LOG="${RUNNER_TEMP}/e2e-api.log"
          npx tsx server/index.ts >"${SERVER_LOG}" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3100/api/health" >/dev/null; then
              echo "API ready"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "API process exited early"
              echo "--- API startup log ---"
              cat "${SERVER_LOG}" || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for API health"
              echo "--- API startup log ---"
              cat "${SERVER_LOG}" || true
              exit 1
            fi
          done

          npm run test:e2e

      - name: Upload E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ci-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/e2e-api.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # opengrep — SAST (soft job). Escape hatch: always() so quality failure
  # does not Skipped this job.
  # ---------------------------------------------------------------------------
  opengrep:
    name: OpenGrep SAST
    runs-on: ubuntu-24.04
    needs: quality
    # Escape hatch: re-evaluate after quality even when quality failed.
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenGrep
        # Pin a release binary for reproducible CI (manylinux x86_64 on GitHub-hosted Linux).
        # Bump OPENGREP_VERSION deliberately when upgrading.
        env:
          OPENGREP_VERSION: v1.25.0
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL -o "${HOME}/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          chmod +x "${HOME}/bin/opengrep"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/opengrep" --version

      - name: OpenGrep SAST scan
        # --severity ERROR: only ERROR-level rules count toward failure
        # --error: non-zero exit when matching findings exist
        # --sarif-output: for GitHub Code Scanning upload (next step)
        # --exclude: path patterns (not --exclude-dir; -e is pattern search)
        run: |
          opengrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --sarif-output=opengrep.sarif \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=.git \
            .

      - name: Upload OpenGrep results to GitHub Security
        # Step escape hatch: upload even when the scan step failed on findings
        if: ${{ always() && hashFiles('opengrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  # ---------------------------------------------------------------------------
  # image — Docker build, SBOM, Trivy (soft step), export artifact
  # Escape hatch: always() after quality + e2e-ci + opengrep (neither may Skipped us).
  # ---------------------------------------------------------------------------
  image:
    name: Build, SBOM and container scan
    runs-on: ubuntu-24.04
    needs: [quality, e2e-ci, opengrep]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 30

    steps:
      - name: Require quality and E2E
        # Hard gates: do not ship an image when build or Playwright failed.
        # Job still *starts* via escape hatch so it is not Skipped.
        if: ${{ needs.quality.result != 'success' || needs.e2e-ci.result != 'success' }}
        run: |
          echo "quality=${{ needs.quality.result }} e2e-ci=${{ needs.e2e-ci.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable deployment image
        # Labels embed git revision + source URL for supply-chain traceability.
        # Tag both SHA (immutable) and latest (compose convenience on the VM).
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Generate CycloneDX SBOM
        # Software Bill of Materials for the exact image we are about to scan/deploy
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error

      - name: Trivy vulnerability scan
        # Soft step: findings fail this step; continue-on-error keeps export alive.
        # scanners:vuln only — skip secret scan of large layer blobs (npm cacache noise).
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Export exact scanned image
        # Persist the bit-identical image that Trivy scanned (gzip + checksum)
        run: |
          docker save \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:latest" |
          gzip --best > grc-app-image.tar.gz

          sha256sum grc-app-image.tar.gz > grc-app-image.tar.gz.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: grc-app-image-${{ github.sha }}
          path: |
            grc-app-image.tar.gz
            grc-app-image.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # deploy — escape hatch always(); production steps only on main push
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy exact image to GCP VM
    runs-on: ubuntu-24.04
    needs: image
    # Escape hatch + hard require: never Skipped when image fails transitively,
    # but only promote when the image job actually uploaded the artifact.
    if: ${{ always() && !cancelled() && needs.image.result == 'success' }}
    timeout-minutes: 20
    # production env only on main push so PRs are not held by deploy protection
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'ci' }}
      url: http://136.112.38.75

    steps:
      - name: Decide whether to promote to production
        id: promote
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Promoting image to production VM."
          else
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Job ran via escape hatch; production deploy steps gated to main push."
          fi

      - name: Checkout deployment configuration
        if: steps.promote.outputs.should_deploy == 'true'
        uses: actions/checkout@v5

      - name: Download scanned image
        if: steps.promote.outputs.should_deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: grc-app-image-${{ github.sha }}
          path: deployment-artifact

      - name: Verify deployment artifact
        if: steps.promote.outputs.should_deploy == 'true'
        working-directory: deployment-artifact
        run: sha256sum --check grc-app-image.tar.gz.sha256

      # Fail before auth/gcloud with an actionable message when WIF secrets or
      # the project id variable are missing (auth@v3 otherwise says only
      # "must specify exactly one of workload_identity_provider or credentials_json").
      - name: Validate GCP configuration
        if: steps.promote.outputs.should_deploy == 'true'
        env:
          HAS_PROJECT_ID: ${{ vars.GCP_PROJECT_ID != '' }}
          HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_SA: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          ok=1
          if [ "${HAS_PROJECT_ID}" != "true" ]; then
            echo "::error::GCP_PROJECT_ID is empty. Add repository variable GCP_PROJECT_ID (Settings → Secrets and variables → Actions → Variables)."
            ok=0
          else
            echo "GCP_PROJECT_ID is set (${GCP_PROJECT_ID})."
          fi
          if [ "${HAS_WIF}" != "true" ]; then
            echo "::error::secrets.GCP_WORKLOAD_IDENTITY_PROVIDER is empty. Add the full provider resource name, e.g. projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER."
            ok=0
          fi
          if [ "${HAS_SA}" != "true" ]; then
            echo "::error::secrets.GCP_SERVICE_ACCOUNT is empty. Add the deployer service-account email, e.g. deploy-sa@PROJECT_ID.iam.gserviceaccount.com."
            ok=0
          fi
          if [ "${ok}" -ne 1 ]; then
            echo "Configure Workload Identity Federation secrets + GCP_PROJECT_ID, then re-run deploy."
            exit 1
          fi
          echo "GCP auth inputs look present."

      - name: Verify GCP deploy configuration
        if: steps.promote.outputs.should_deploy == 'true'
        env:
          # Presence checks only — never print secret values.
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          HAS_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          missing=0
          if [ -z "${GCP_PROJECT_ID_VALUE}" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set. Settings → Secrets and variables → Actions → Variables."
            missing=1
          else
            echo "GCP_PROJECT_ID is set."
          fi
          if [ "${HAS_WIF_PROVIDER}" != "true" ]; then
            echo "::error::Secret GCP_WORKLOAD_IDENTITY_PROVIDER is missing/empty (or not available to the 'production' environment). Settings → Secrets and variables → Actions → Secrets (or Environments → production → Secrets). Value looks like: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER"
            missing=1
          else
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER is set."
          fi
          if [ "${HAS_SERVICE_ACCOUNT}" != "true" ]; then
            echo "::error::Secret GCP_SERVICE_ACCOUNT is missing/empty (or not available to the 'production' environment). Expected the deploy service account email."
            missing=1
          else
            echo "GCP_SERVICE_ACCOUNT is set."
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Cannot call google-github-actions/auth without WIF inputs. Configure the variable/secrets above, then re-run this workflow."
            exit 1
          fi

      - name: Authenticate to Google Cloud with OIDC
        if: steps.promote.outputs.should_deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.promote.outputs.should_deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          # Populated from repository variable vars.GCP_PROJECT_ID (see env above).
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Upload image and deployment files
        if: steps.promote.outputs.should_deploy == 'true'
        run: |
          gcloud compute scp \
            deployment-artifact/grc-app-image.tar.gz \
            docker-compose.yml \
            deploy/Caddyfile \
            "${GCP_VM_NAME}:/tmp/" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet

      - name: Deploy on VM
        if: steps.promote.outputs.should_deploy == 'true'
        # docker load CI artifact; compose up --no-build (immutable bytes from CI)
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              set -Eeuo pipefail

              sudo mkdir -p '${DEPLOY_PATH}/deploy'
              sudo cp /tmp/docker-compose.yml '${DEPLOY_PATH}/docker-compose.yml'
              sudo cp /tmp/Caddyfile '${DEPLOY_PATH}/deploy/Caddyfile'
              sudo chown -R \$(id -u):\$(id -g) '${DEPLOY_PATH}'

              gzip --decompress --stdout /tmp/grc-app-image.tar.gz | docker load

              cd '${DEPLOY_PATH}'
              docker compose config --quiet
              docker compose up -d --no-build --remove-orphans

              docker image prune -f
              docker compose ps

              rm -f /tmp/grc-app-image.tar.gz \
                    /tmp/docker-compose.yml \
                    /tmp/Caddyfile
            "

      - name: Wait for health endpoint
        if: steps.promote.outputs.should_deploy == 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "${APP_URL}/api/health"; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Health check ${attempt}/24 failed."
            sleep 5
          done

          echo "Deployment health check failed."
          exit 1

      - name: Collect deployment logs after failure
        if: ${{ failure() && steps.promote.outputs.should_deploy == 'true' }}
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              cd '${DEPLOY_PATH}' &&
              docker compose ps &&
              docker compose logs --tail=200
            " || true

  # ---------------------------------------------------------------------------
  # e2e-prod — escape hatch always(); Playwright against APP_URL only on main push
  # ---------------------------------------------------------------------------
  e2e-prod:
    name: Post-deployment E2E
    runs-on: ubuntu-24.04
    needs: deploy
    if: ${{ always() && !cancelled() && needs.deploy.result == 'success' }}
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Decide whether to run E2E against production
        id: e2e_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "Job ran via escape hatch; production E2E gated to main push only."
          fi

      - name: Checkout
        if: steps.e2e_gate.outputs.should_run == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: steps.e2e_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against production
        if: steps.e2e_gate.outputs.should_run == 'true'
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ env.APP_URL }}
          E2E_EMAIL: ${{ vars.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload E2E report
        if: ${{ always() && steps.e2e_gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
